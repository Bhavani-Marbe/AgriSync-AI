version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: agrisync-postgres
    restart: always
    environment:
      POSTGRES_DB: agrisync_db
      POSTGRES_USER: agrisync_user
      POSTGRES_PASSWORD: agrisync_password_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agrisync_user -d agrisync_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: agrisync-redis
    restart: always
    ports:
      - "6379:6379"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agrisync-enterprise-app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DB_ENGINE=django.db.backends.postgresql
      - POSTGRES_DB=agrisync_db
      - POSTGRES_USER=agrisync_user
      - POSTGRES_PASSWORD=agrisync_password_2026
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  postgres_data:
