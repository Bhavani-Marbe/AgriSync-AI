name: AgriSync Enterprise CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Run Django & ML Backend Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install scikit-learn joblib numpy pandas reportlab google-genai

      - name: Run Django Tests
        env:
          PYTHONPATH: backend
          DB_ENGINE: django.db.backends.sqlite3
        run: |
          python3 backend/manage.py test apps.authentication.tests apps.farms.tests apps.ml_intelligence.tests apps.disease.tests apps.weather.tests apps.market.tests apps.agronomist.tests apps.smart_irrigation.tests apps.fertilizers.tests apps.notifications.tests apps.reports.tests apps.analytics.tests apps.admin_portal.tests

  frontend-build:
    name: Build React & Vite Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Node.js 20
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install Node Dependencies
        run: npm ci

      - name: Type Check & Lint
        run: npm run lint

      - name: Build Production Assets
        run: npm run build
